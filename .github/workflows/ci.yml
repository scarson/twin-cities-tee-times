name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore: &docs-paths
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - '.serena/**'
      - 'LICENSE'
  pull_request:
    branches: [main, dev]
    paths-ignore: *docs-paths

permissions:
  contents: read

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**') }}
          restore-keys: |
            nextjs-${{ hashFiles('package-lock.json') }}-
      - run: npx @opennextjs/cloudflare build

  proxy-tests:
    name: Proxy Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14" # match the Lambda runtime
      # Pure-logic tests for the fetch-proxy's challenge classifier and the CPS
      # curl_cffi rotation decision. No pip deps — challenge.py/rotate.py do not
      # import curl_cffi (the live probe does, and runs in the rotation workflow).
      - run: python -m unittest test_challenge test_rotate -v
        working-directory: lambda/fetch-proxy
