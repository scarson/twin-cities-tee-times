# Detects whether CPS's Cloudflare challenge has aged out the pinned curl_cffi
# fingerprint and, only when a newer curl_cffi LIVE-clears the real challenge AND
# is vendor-deployable to the Lambda, auto-merges a requirements.txt bump to both
# `main` and `dev` and triggers a deploy of `main`. Fail-closed: never ships an
# unverified or undeployable version. See docs/plans/2026-06-08-cps-profile-rotation-design.md.
name: CPS profile rotation

on:
  schedule:
    - cron: "30 13 * * *" # daily ~07:30 CT; fires rarely (~3-9mo), so daily is ample
  workflow_dispatch:
    inputs:
      force_check:
        description: "Probe latest even if the pinned version still clears"
        type: boolean
        default: false
      dry_run:
        description: "Print the intended rotation without merging or deploying"
        type: boolean
        default: false

permissions:
  contents: write # push the bump branches
  pull-requests: write # open + auto-merge the bump PRs
  actions: write # dispatch deploy.yml

# Never let two rotation runs race (each one merges to main/dev and deploys).
concurrency:
  group: cps-profile-rotation
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  probe-and-rotate:
    name: Probe CPS challenge & auto-rotate curl_cffi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14" # match the Lambda runtime

      - name: Run pure-logic unit tests
        working-directory: lambda/fetch-proxy
        run: python -m unittest test_challenge test_rotate -v

      - name: Read pinned curl_cffi version
        id: pinned
        # `dev` and `main` are kept in lockstep by this workflow, so the checked-out
        # (default-branch = dev) requirements.txt is the deployed pin.
        run: |
          set -euo pipefail
          PINNED=$(sed -n 's/^curl_cffi==//p' lambda/fetch-proxy/requirements.txt)
          [ -n "$PINNED" ] || { echo "::error::could not parse pinned curl_cffi version"; exit 1; }
          echo "version=$PINNED" >> "$GITHUB_OUTPUT"

      - name: Probe pinned curl_cffi (chrome only — detect primary aging)
        id: probe_pinned
        working-directory: lambda/fetch-proxy
        run: |
          set -euo pipefail
          python -m pip install --quiet "curl_cffi==${{ steps.pinned.outputs.version }}"
          # `|| true`: probe.py exits non-zero by design (CHALLENGED=1, ERROR=2) so a
          # plain shell could branch on it — but here the verdict is read from the JSON
          # file, so under `set -e` we MUST NOT let a CHALLENGED exit kill the step.
          python probe.py --subdomain jcgsc5 --profiles chrome --out pinned.json || true
          # Fail loud at the source if the probe produced no verdict file (e.g. a
          # module-load crash) rather than emitting an empty verdict that masks a
          # real outage downstream.
          [ -f pinned.json ] || { echo "::error::pinned probe produced no output"; exit 1; }
          echo "verdict=$(python -c 'import json;print(json.load(open("pinned.json"))["verdict"])')" >> "$GITHUB_OUTPUT"

      - name: Probe latest curl_cffi (full cascade)
        id: probe_latest
        if: steps.probe_pinned.outputs.verdict == 'CHALLENGED' || inputs.force_check
        working-directory: lambda/fetch-proxy
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade curl_cffi
          LATEST=$(python -c 'import curl_cffi;print(curl_cffi.__version__)')
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          python probe.py --subdomain jcgsc5 --out latest.json || true  # verdict read from JSON; don't let a CHALLENGED exit fail the step
          [ -f latest.json ] || { echo "::error::latest probe produced no output"; exit 1; }

      - name: Decide
        id: decide
        if: steps.probe_pinned.outcome == 'success'
        working-directory: lambda/fetch-proxy
        run: |
          set -euo pipefail
          ARGS=(--pinned-json pinned.json --pinned-version "${{ steps.pinned.outputs.version }}" --body-out pr_body.md)
          # Require BOTH the verdict file and a non-empty version; a latest.json
          # with no captured version means the latest probe was inconclusive, so
          # decide() treats latest as not-evaluated (→ FAIL when pinned is broken)
          # rather than proposing an empty-version bump.
          if [ -f latest.json ] && [ -n "${{ steps.probe_latest.outputs.version }}" ]; then
            ARGS+=(--latest-json latest.json --latest-version "${{ steps.probe_latest.outputs.version }}")
          fi
          # On a `schedule` trigger `inputs.*` is unset and expands to "" (falsy).
          if [ "${{ inputs.force_check }}" = "true" ]; then ARGS+=(--force-check); fi
          python rotate.py "${ARGS[@]}" | tee decision.json
          echo "action=$(python -c 'import json;print(json.load(open("decision.json"))["action"])')" >> "$GITHUB_OUTPUT"

      - name: Deployability gate — candidate must cross-vendor for the Lambda
        if: steps.decide.outputs.action == 'open_pr'
        env:
          LATEST: ${{ steps.probe_latest.outputs.version }}
        run: |
          set -euo pipefail
          # Validate the version (passed via env, not interpolated) before it reaches pip.
          [[ "$LATEST" =~ ^[0-9][0-9A-Za-z.+-]*$ ]] || { echo "::error::refusing unsafe version string: $LATEST"; exit 1; }
          python3 -m pip install \
            --target /tmp/vendor-check \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.14 \
            --only-binary=:all: \
            "curl_cffi==$LATEST" \
            || { echo "::error::curl_cffi $LATEST cleared the challenge but is NOT vendor-deployable to the Lambda (manylinux2014/cp314). Not rotating."; exit 1; }

      - name: Rotate — bump main & dev, auto-merge, deploy (live- and deploy-gated)
        if: steps.decide.outputs.action == 'open_pr' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.probe_latest.outputs.version }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$LATEST" =~ ^[0-9][0-9A-Za-z.+-]*$ ]] || { echo "::error::refusing unsafe version string: $LATEST"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bumped_main=0
          # Bump both release-tracking branches off their OWN tips so neither drags
          # the other's unmerged work across; idempotently skip a branch already at
          # the target. The byte-identical change keeps dev/main conflict-free at the
          # next publication merge.
          for base in main dev; do
            git fetch origin "$base"
            branch="chore/cps-curl-cffi-bump-${LATEST}-${base}-${RUN_ID}"
            git checkout -B "$branch" "origin/$base"
            sed -i "s|^curl_cffi==.*|curl_cffi==${LATEST}|" lambda/fetch-proxy/requirements.txt
            if git diff --quiet -- lambda/fetch-proxy/requirements.txt; then
              echo "origin/$base already at curl_cffi==${LATEST}; skipping."
              continue
            fi
            git add lambda/fetch-proxy/requirements.txt
            git commit -m "chore(proxy): bump curl_cffi to ${LATEST} (CPS fingerprint rotation)"
            git push -u origin "$branch"
            gh pr create --base "$base" --head "$branch" \
              --title "chore(proxy): rotate CPS curl_cffi to ${LATEST} (${base})" \
              --body-file lambda/fetch-proxy/pr_body.md
            # Synchronous --merge (NOT --auto: the deploy below must not fire until
            # main actually carries the bump). Retry the transient window where
            # GitHub hasn't computed mergeability yet.
            merged=0
            for attempt in 1 2 3 4; do
              if gh pr merge "$branch" --merge --delete-branch; then merged=1; break; fi
              echo "merge attempt ${attempt} failed; retrying in 5s…"; sleep 5
            done
            [ "$merged" = "1" ] || { echo "::error::failed to merge ${branch} into ${base}"; exit 1; }
            [ "$base" = "main" ] && bumped_main=1 || true
          done
          if [ "$bumped_main" = "1" ]; then
            echo "main bumped → triggering deploy.yml on main."
            gh workflow run deploy.yml --ref main
          else
            echo "main already at curl_cffi==${LATEST}; no deploy triggered."
          fi

      - name: Dry run — print intended rotation
        if: steps.decide.outputs.action == 'open_pr' && inputs.dry_run == true
        working-directory: lambda/fetch-proxy
        run: |
          echo "DRY RUN — would bump curl_cffi to ${{ steps.probe_latest.outputs.version }} on main+dev, auto-merge both, and trigger deploy.yml on main. PR body:"
          cat pr_body.md

      - name: Surface the decision exit code (loud on terminal cases)
        if: steps.decide.outcome == 'success'
        run: |
          set -euo pipefail
          REASON=$(python -c 'import json;print(json.load(open("lambda/fetch-proxy/decision.json"))["reason"])')
          CODE=$(python -c 'import json;print(json.load(open("lambda/fetch-proxy/decision.json"))["exit_code"])')
          echo "Decision: ${{ steps.decide.outputs.action }} — $REASON"
          exit "$CODE"
