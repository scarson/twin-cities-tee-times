name: Deploy

on:
  push:
    branches: [main]
  # Lets the CPS rotation workflow trigger a deploy of main after auto-merging a
  # curl_cffi bump: a GITHUB_TOKEN push to main does NOT fire the push trigger
  # above (GitHub's recursion guard), but workflow_dispatch is exempt.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Never run two production deploys at once (the rotation workflow can dispatch one
# while a push-triggered one is in flight). Queue, don't cancel — a deploy should finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**') }}
          restore-keys: |
            nextjs-${{ hashFiles('package-lock.json') }}-
      - name: Set build metadata
        run: |
          echo "NEXT_PUBLIC_BUILD_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - run: npx @opennextjs/cloudflare build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply tee-times-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Seed course catalog
        run: npx tsx scripts/seed.ts && npx wrangler d1 execute tee-times-db --remote --file=scripts/seed.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2

      # Vendor curl_cffi (+ deps) as manylinux x86_64 wheels targeting cp314 so
      # the Lambda's python3.14 runtime can supply a browser TLS fingerprint that
      # clears CPS Golf's Cloudflare bot-challenge. curl_cffi's cp310-abi3 wheel
      # is forward-compatible and pip selects it for --python-version 3.14; cffi
      # resolves to its cp314 wheel. Cross-targets regardless of the runner's own
      # Python version; --only-binary forbids source builds (which would link
      # against the wrong libc/libffi).
      - name: Vendor Lambda proxy dependencies
        run: |
          python3 -m pip install \
            --target lambda/fetch-proxy \
            --requirement lambda/fetch-proxy/requirements.txt \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.14 \
            --only-binary=:all:

      - name: Deploy Lambda proxy
        uses: aws-actions/aws-lambda-deploy@v1.1.2
        with:
          function-name: tee-times-fetch-proxy
          code-artifacts-dir: lambda/fetch-proxy
          handler: index.handler
          runtime: python3.14
          timeout: 15
          memory-size: 256

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
